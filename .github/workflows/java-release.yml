name: Java Release

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK for the normal release validation build
        type: string
        default: '25'
      release-tag:
        description: Existing immutable vYY.MM.Patch tag at the exact caller source SHA
        required: true
        type: string
      release-policy:
        description: Reviewed repository policy JSON tracked at the release tag
        required: true
        type: string
      destination:
        description: github, central, or both; every selected destination must verify
        type: string
        default: github
      dry-run:
        description: Validate and freeze artifacts without publishing or creating a release
        type: boolean
        default: true
      deploy-module:
        description: Legacy selector; nonempty values are refused; use the full policy artifact set
        type: string
        default: ''
      deploy-modules:
        description: Legacy selector; nonempty values are refused; use the full policy artifact set
        type: string
        default: ''

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      packages: write
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.release-tag }}
      cancel-in-progress: false
    steps:
      - name: Require immutable reusable workflow identity
        id: tools
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
          LEGACY_MODULE: ${{ inputs.deploy-module }}
          LEGACY_MODULES: ${{ inputs.deploy-modules }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          job = json.loads(os.environ['JOB_CONTEXT'])
          sha = job.get('workflow_sha', '')
          expected = 'fireflysoftwaresolutions/.github/.github/workflows/java-release.yml@' + sha
          if (not re.fullmatch('[0-9a-f]{40}', sha) or job.get('workflow_ref') != expected
              or os.environ['LEGACY_MODULE'] or os.environ['LEGACY_MODULES']):
              raise SystemExit('Immutable workflow SHA and complete artifact-set migration required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY
      - name: Checkout exact caller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact reusable workflow tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: fireflysoftwaresolutions/.github
          ref: ${{ steps.tools.outputs.sha }}
          path: release-tools
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
      - name: Validate cold source, freeze artifacts, and publish exact manifest
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_POLICY: ${{ inputs.release-policy }}
          RELEASE_DESTINATION: ${{ inputs.destination }}
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          RELEASE_WORKFLOW_SHA: ${{ steps.tools.outputs.sha }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          python3 release-tools/scripts/java_release.py --source source
      - name: Retain validation manifest and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/java-release-evidence/validation-state.json
            ${{ runner.temp }}/java-release-evidence/validation-failure.json
            ${{ runner.temp }}/java-release-evidence/release-manifest.json
            ${{ runner.temp }}/java-release-evidence/publication-receipts.json
            ${{ runner.temp }}/java-release-evidence/release-created.json
          if-no-files-found: error
